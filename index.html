<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest - Online Shopping</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>ShopNest</h1>
        <div class="cart-info">
            Cart: <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Main Section -->
    <main>
        <h2>Explore Products</h2>

        <!-- Search Box -->
        <input type="text" id="search-input" placeholder="Search products...">

        <!-- Category Buttons -->
        <div class="category-buttons">
            <button class="category-btn active" data-category="All">All</button>
            <button class="category-btn" data-category="Electronics">Electronics</button>
            <button class="category-btn" data-category="Clothing">Clothing</button>
            <button class="category-btn" data-category="Footwear">Footwear</button>
            <button class="category-btn" data-category="Books">Books</button>
        </div>

        <!-- Product Display -->
        <section>
            <div id="product-list" class="product-list"></div>
            <p id="no-products" class="no-products">No products found</p>
        </section>

        <!-- Shopping Cart -->
        <section class="cart-section">
            <h2>Shopping Cart</h2>
            <div id="cart-list"></div>
            <h3>Total: ₹<span id="total-price">0</span></h3>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
